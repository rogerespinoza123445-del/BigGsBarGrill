<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061f16">
  <meta name="description" content="Big G's Bar & Grill — Play Your Cards Right">
  <title>Big G's Bar & Grill</title>

  <style>
    :root {
      --bg: #03150f;
      --panel: rgba(6, 39, 27, .90);
      --panel-2: rgba(10, 54, 37, .92);
      --gold: #f4c95d;
      --gold-light: #ffe7a0;
      --cream: #fff8e8;
      --muted: rgba(255,248,232,.72);
      --line: rgba(244,201,93,.36);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% -20%, rgba(244,201,93,.18), transparent 38%),
        radial-gradient(circle at 15% 40%, rgba(14,91,60,.20), transparent 32%),
        linear-gradient(180deg, #03150f 0%, #06271b 55%, #03150f 100%);
      color: var(--cream);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100svh;
      padding: 18px 12px 28px;
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 820px);
      margin: 0 auto;
      position: relative;
    }

    .page::before,
    .page::after {
      content: "";
      position: fixed;
      pointer-events: none;
      font-size: clamp(70px, 20vw, 150px);
      font-weight: 900;
      color: rgba(244,201,93,.035);
      z-index: 0;
    }

    .page::before {
      content: "♠";
      top: 5vh;
      left: -4vw;
      transform: rotate(-14deg);
    }

    .page::after {
      content: "♥";
      bottom: 6vh;
      right: -2vw;
      transform: rotate(12deg);
    }

    .topline {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 12px;
    }

    .brand {
      font-size: clamp(13px, 3.3vw, 17px);
      font-weight: 850;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .subbrand {
      margin-top: 4px;
      font-size: clamp(11px, 2.7vw, 13px);
      color: var(--muted);
      letter-spacing: .08em;
    }

    .poster-shell {
      position: relative;
      z-index: 1;
      border-radius: 24px;
      padding: 1px;
      background:
        linear-gradient(135deg,
          rgba(255,231,160,.85),
          rgba(244,201,93,.18) 28%,
          rgba(244,201,93,.60) 62%,
          rgba(255,231,160,.85));
      box-shadow:
        0 20px 70px rgba(0,0,0,.55),
        0 0 32px rgba(244,201,93,.10);
    }

    .poster-card {
      border-radius: 23px;
      padding: 10px;
      background:
        linear-gradient(180deg, rgba(5,31,22,.98), rgba(2,17,12,.98));
    }

    .poster {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      object-fit: contain;
    }

    .event-strip {
      position: relative;
      z-index: 2;
      width: calc(100% - 28px);
      margin: -18px auto 0;
      padding: 14px 16px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(11,59,41,.96), rgba(4,32,22,.98));
      border: 1px solid var(--line);
      box-shadow:
        0 14px 36px rgba(0,0,0,.40),
        inset 0 0 26px rgba(244,201,93,.05);
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .event-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 800;
      line-height: 1.05;
      color: var(--gold-light);
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    .event-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: clamp(11px, 2.8vw, 13px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .countdown-wrap {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      padding: 19px 14px 15px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      box-shadow:
        0 18px 48px rgba(0,0,0,.34),
        inset 0 0 32px rgba(244,201,93,.05);
    }

    .eyebrow {
      text-align: center;
      margin-bottom: 14px;
      font-size: clamp(10px, 2.6vw, 13px);
      letter-spacing: .22em;
      text-transform: uppercase;
      font-weight: 850;
      color: var(--gold-light);
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .unit {
      min-width: 0;
      padding: 13px 5px 10px;
      border-radius: 15px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.028));
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }

    .num {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(26px, 7.5vw, 48px);
      line-height: .95;
      font-weight: 950;
      color: var(--gold);
      text-shadow:
        0 2px 0 #5d4108,
        0 0 16px rgba(244,201,93,.25);
    }

    .label {
      display: block;
      margin-top: 7px;
      font-size: clamp(8px, 2.1vw, 11px);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,248,232,.73);
    }

    .divider {
      width: 78px;
      height: 1px;
      margin: 14px auto 11px;
      background: linear-gradient(90deg, transparent, rgba(244,201,93,.75), transparent);
    }

    .date {
      text-align: center;
      font-size: clamp(12px, 3vw, 14px);
      font-weight: 700;
      color: rgba(255,248,232,.90);
      letter-spacing: .04em;
    }

    .tagline {
      text-align: center;
      margin-top: 7px;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      color: var(--gold-light);
      font-size: clamp(12px, 3vw, 15px);
    }

    .finished {
      display: none;
      padding: 16px 8px 10px;
      text-align: center;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 900;
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 15px;
      text-align: center;
      color: rgba(255,248,232,.43);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px 8px 22px;
      }

      .poster-card {
        padding: 7px;
      }

      .countdown-wrap {
        padding: 16px 9px 13px;
        border-radius: 18px;
      }

      .timer {
        gap: 5px;
      }

      .unit {
        padding: 11px 2px 9px;
      }

      .event-strip {
        width: calc(100% - 20px);
        margin-top: -14px;
      }
    }
  </style>
</head>

  <script>
    const target = new Date("2026-10-31T17:00:00Z").getTime();

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function updateCountdown() {
      const now = Date.now();
      const distance = target - now;

      if (distance <= 0) {
        document.getElementById("timer").style.display = "none";
        document.getElementById("finished").style.display = "block";
        return;
      }

      const days = Math.floor(distance / 86400000);
      const hours = Math.floor((distance % 86400000) / 3600000);
      const minutes = Math.floor((distance % 3600000) / 60000);
      const seconds = Math.floor((distance % 60000) / 1000);

      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
